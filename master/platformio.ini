[platformio]
default_envs = uno

[env:uno]
platform = platformio/atmelavr@5.0.0
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -I../shared
test_ignore = *

[env:native]
platform = native
build_flags = -I../shared -std=c++11
lib_extra_dirs = ../conveyor/lib, ../sensing/lib
test_framework = unity
